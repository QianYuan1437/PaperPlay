<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="PaperPlay：Windows 上的 Wallpaper Engine 视频订阅与本地影音播放器。在线体验播放、队列、模糊预览与个性主题。">
<meta name="theme-color" content="#f5f3eb"><title>PaperPlay · 让收藏，重新流动</title>
<link rel="icon" href="icon.png" type="image/png"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
<a class="skip-link" href="#workspace">跳到体验区</a><div class="ambient" aria-hidden="true"><i></i><i></i></div>
<aside class="sidebar">
  <a class="brand" href="#overview"><img src="icon.png" width="38" height="38" alt="">PaperPlay<span class="brand-dot"></span></a>
  <nav id="navigation" aria-label="体验导航">
    <a href="#overview" data-route="overview"><i data-icon="grid"></i><span>概览</span></a>
    <a href="#library" data-route="library"><i data-icon="library"></i><span>订阅库</span></a>
    <a href="#queue" data-route="queue"><i data-icon="list"></i><span>播放队列</span><b id="queue-count">3</b></a>
    <a href="#player" data-route="player"><i data-icon="play"></i><span>播放器</span></a>
    <a href="#local" data-route="local"><i data-icon="folder"></i><span>本地媒体</span></a>
    <a href="#performance" data-route="performance"><i data-icon="pulse"></i><span>性能</span></a>
    <a href="#appearance" data-route="appearance"><i data-icon="sliders"></i><span>外观</span></a>
  </nav>
  <div class="sidebar-bottom"><a class="source-link" href="https://github.com/QianYuan1437/PaperPlay" target="_blank" rel="noopener"><i data-icon="code"></i>源代码<i data-icon="arrow"></i></a><a id="version" class="version" href="https://github.com/QianYuan1437/PaperPlay/releases/latest" target="_blank" rel="noopener">v1.0.12<i data-icon="arrow"></i></a></div>
</aside>
<div class="page">
  <header class="topbar"><div class="breadcrumb">PaperPlay <span>/</span> <strong id="page-name">概览</strong></div><div class="global-tools">
    <button class="pill" id="audio-toggle" aria-pressed="false"><i data-icon="headphones"></i><span>纯音频</span></button>
    <button class="pill" id="blur-toggle" aria-pressed="false"><i data-icon="blur"></i><span>模糊预览</span></button>
    <button class="icon-button" id="theme-toggle" aria-label="切换深浅主题"><i data-icon="moon"></i></button>
  </div></header>
  <main id="workspace" tabindex="-1">
    <section class="intro-panel">
      <div class="intro-copy"><div class="edition"><span></span> WINDOWS · OPEN SOURCE</div><h1>让收藏，<br>重新<span>流动。</span></h1><p class="lead">喜欢的画面，<br>也可以是随行的声音。</p>
        <div class="download-actions"><a class="button primary" id="download" href="https://github.com/QianYuan1437/PaperPlay/releases/latest" target="_blank" rel="noopener"><i data-icon="windows"></i>下载 Windows 版<i data-icon="download"></i></a><a class="button quiet" id="portable" href="https://github.com/QianYuan1437/PaperPlay/releases/latest" target="_blank" rel="noopener">便携版 ZIP<i data-icon="arrow"></i></a></div>
        <div class="color-dots" aria-label="主题色"><button data-accent="gold" aria-label="暖金主题" aria-pressed="true"></button><button data-accent="sage" aria-label="苔绿主题" aria-pressed="false"></button><button data-accent="blue" aria-label="雾蓝主题" aria-pressed="false"></button><button data-accent="rose" aria-label="柔粉主题" aria-pressed="false"></button></div>
      </div>
      <a class="feature-note" href="#local"><div class="note-icon"><i data-icon="folder"></i></div><span>你的媒体。<br><strong>始终留在本机。</strong></span><i data-icon="arrow"></i></a>
    </section>
    <section class="experience" aria-label="PaperPlay 在线交互演示"><div class="experience-heading"><span class="live-badge"><i></i>交互演示</span><span id="view-label">随心选择，即刻播放</span><button class="icon-button" id="reset-demo" aria-label="重置演示"><i data-icon="reset"></i></button></div><div id="view" tabindex="-1"></div></section>
  </main>
  <footer><span>Wallpaper Engine 视频订阅 · 本地影音</span><a href="https://github.com/QianYuan1437/PaperPlay/blob/main/THIRD_PARTY_NOTICES.md" target="_blank" rel="noopener">开源致谢<i data-icon="arrow"></i></a></footer>
</div>
<section class="transport" aria-label="播放控制">
  <button class="now-playing" id="now-playing" aria-label="打开播放器"><img id="now-art" src="media/tide.svg" alt=""><span><strong id="now-title">暮色潮汐</strong><span id="now-kind">原创演示片段</span></span><i data-icon="expand"></i></button>
  <div class="transport-center"><div class="transport-buttons"><button class="icon-button" id="previous" aria-label="上一首"><i data-icon="previous"></i></button><button class="play-button" id="play" aria-label="播放"><i data-icon="play"></i></button><button class="icon-button" id="next" aria-label="下一首"><i data-icon="next"></i></button></div><div class="seek-row"><output id="elapsed">0:00</output><input id="seek" type="range" min="0" max="1000" value="0" aria-label="播放进度"><output id="duration">0:12</output></div></div>
  <div class="transport-right"><button class="pill" id="mode" aria-label="播放模式：列表循环"><i data-icon="repeat"></i><span>列表循环</span></button><button class="icon-button" id="mute" aria-label="静音"><i data-icon="volume"></i></button><input id="volume" type="range" min="0" max="100" value="35" aria-label="音量"></div>
</section>
<div id="media-home" hidden><video id="media" playsinline preload="metadata" poster="media/tide.svg" src="media/tide.mp4"></video></div>
<input id="file-input" type="file" accept="video/*,audio/*" multiple hidden><div id="toast" role="status" aria-live="polite"></div>
<noscript><div class="no-script">启用 JavaScript 可体验播放器；下载链接仍可直接使用。</div></noscript>
</body></html>
