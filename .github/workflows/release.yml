name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z); creates a new immutable version tag'
        required: true
        default: '1.0.11'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be X.Y.Z' }
          if ($env:REF_TYPE -ne 'tag') {
            $existing = git rev-parse --verify "refs/tags/v$version" 2>$null
            if ($LASTEXITCODE -eq 0 -and $existing -ne $env:GITHUB_SHA) { throw 'Existing tag points to a different commit; choose a new version.' }
          }
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists; historical releases are never overwritten." }
          $global:LASTEXITCODE = 0
          git rev-parse --verify "refs/tags/v$version" *> $null
          if ($LASTEXITCODE -ne 0) {
            # Pin the tag before the long build. Creating a tag on an older
            # workflow commit later can require permissions GITHUB_TOKEN lacks.
            gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/v$version" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create version tag. Push the tag and run this workflow on that tag.' }
          }
          $global:LASTEXITCODE = 0
          "value=$version" >> $env:GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Verify Windows shell identity
        run: ./tool/test_shell_identity.ps1
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Restored video first-play regression
        run: flutter test integration_test/restore_playback_test.dart -d windows --dart-define="TEST_MEDIA=${{ github.workspace }}/test/fixtures/sample.mp4"
      - name: Audio to video surface regression
        run: flutter test integration_test/audio_switch_test.dart -d windows --dart-define="TEST_MEDIA=${{ github.workspace }}/test/fixtures/sample.mp4"
      - name: Video texture and seek stress regression
        run: flutter test integration_test/video_stress_test.dart -d windows
      - name: Video surface drag regression
        run: flutter test integration_test/video_seek_controls_test.dart -d windows
      - name: Bounded loading and transparency regression
        run: flutter test integration_test/large_media_test.dart -d windows
      - name: Codec diagnostic and failed-media regression
        run: flutter test integration_test/codec_diagnostic_test.dart -d windows
      - name: Verify audio playback flicker fix
        run: flutter test integration_test/interaction_test.dart -d windows --dart-define=HEADLESS_AUDIO=true --dart-define="TEST_MEDIA=${{ github.workspace }}/test/fixtures/sample.mp4"
      - name: Verify silent wallpaper background behavior
        run: flutter test integration_test/silent_background_test.dart -d windows --dart-define="SILENT_MEDIA=${{ github.workspace }}/test/fixtures/silent.mp4"
      - run: flutter build windows --release --build-name=${{ steps.version.outputs.value }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ steps.version.outputs.value }}
      - name: Package portable app and installer
        shell: pwsh
        run: ./tool/package.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Verify installer upgrade and Start menu shortcut
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tool/test_installer_upgrade.ps1 -InstallerPath 'dist/PaperPlay-${{ steps.version.outputs.value }}-windows-x64-setup.exe'
      - uses: actions/upload-artifact@v7
        with:
          name: PaperPlay-${{ steps.version.outputs.value }}-release
          path: dist/*
          retention-days: 90
          overwrite: true
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName
          gh release create "v$env:VERSION" @assets --verify-tag --title "PaperPlay v$env:VERSION" --notes-file .github/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
