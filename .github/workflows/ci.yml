name: Windows CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.github/workflows/pages.yml', 'tool/test_pages.cjs', 'tool/pages-tests/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Verify Windows shell identity
        run: ./tool/test_shell_identity.ps1
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Native playback and desktop smoke test
        run: flutter test integration_test/playback_test.dart -d windows --dart-define="SCREENSHOT_DIR=${{ github.workspace }}/artifacts/ui" --dart-define=HEADLESS_AUDIO=true --dart-define="TEST_MEDIA=${{ github.workspace }}/test/fixtures/sample.mp4"
      - name: Restored video first-play regression
        run: flutter test integration_test/restore_playback_test.dart -d windows --dart-define="TEST_MEDIA=${{ github.workspace }}/test/fixtures/sample.mp4"
      - name: Audio to video surface regression
        run: flutter test integration_test/audio_switch_test.dart -d windows --dart-define="TEST_MEDIA=${{ github.workspace }}/test/fixtures/sample.mp4"
      - name: Video texture and seek stress regression
        run: flutter test integration_test/video_stress_test.dart -d windows
      - name: Video surface drag regression
        run: flutter test integration_test/video_seek_controls_test.dart -d windows
      - name: Bounded loading and transparency regression
        run: flutter test integration_test/large_media_test.dart -d windows
      - name: Codec diagnostic and failed-media regression
        run: flutter test integration_test/codec_diagnostic_test.dart -d windows
      - name: Silent wallpaper background regression
        run: flutter test integration_test/silent_background_test.dart -d windows --dart-define="SILENT_MEDIA=${{ github.workspace }}/test/fixtures/silent.mp4"
      - name: Audio playback flicker and interaction regression
        run: flutter test integration_test/interaction_test.dart -d windows --dart-define=HEADLESS_AUDIO=true --dart-define="TEST_MEDIA=${{ github.workspace }}/test/fixtures/sample.mp4"
      - run: flutter build windows --release
      - name: Verify installer upgrade and Start menu shortcut
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '\s+')[1].Split('+')[0]
          ./tool/package.ps1 -Version $version
          ./tool/test_installer_upgrade.ps1 -InstallerPath "dist/PaperPlay-$version-windows-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: PaperPlay-windows-x64-ci
          path: build/windows/x64/runner/Release/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PaperPlay-ui-check
          path: artifacts/ui/
          if-no-files-found: ignore
          retention-days: 7
